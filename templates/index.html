<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Learn Assistant</title>
    <style>
        body {
            background-color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 20px 40px;
            margin: 20px;
            font-size: 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #45a049;
        }
        #question, #answer {
            margin-top: 40px;
            font-size: 28px;
        }
    </style>
</head>
<body>

    <h1>Learn Assistant</h1>

    <button id="show-question-btn" class="btn">Question</button>
    <div id="question"></div>

    <button id="show-answer-btn" class="btn" style="display: none;">Answer</button>
    <div id="answer"></div>

    <script>
        let currentAnswer = '';
        const taskId = 2; // обраний пакет

        document.getElementById("show-question-btn").addEventListener("click", async function() {
            try {
                const response = await fetch(`/learn/random/${taskId}/`);
                const data = await response.json();

                console.log(data); // для перевірки

                document.getElementById("question").innerText = data.text; // <-- правильний ключ
                currentAnswer = data.answer;

                document.getElementById("answer").innerText = "";
                document.getElementById("show-answer-btn").style.display = "inline-block";
            } catch (error) {
                console.error("Помилка при отриманні питання:", error);
                document.getElementById("question").innerText = "Не вдалося отримати питання.";
                document.getElementById("answer").innerText = "";
            }
        });

        document.getElementById("show-answer-btn").addEventListener("click", function() {
        document.getElementById("answer").innerText = currentAnswer;
        });

    </script>

</body>
</html>
